name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # The engine is someone else's tree, taken as it is (README), and its lint state is theirs: warnings
      # are shown, not fatal. A build error or a failing test still fails the run.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked
